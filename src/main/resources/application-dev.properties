# ==========================================================
# DEV PROFILE - Local machine testing
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ==========================================================

server.port=8081

# ---- MySQL (local) ----
# Create the DB first:  CREATE DATABASE erp_dev CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/erp_dev?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# update = safe for local dev since the DB starts empty and evolves with the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- Mail (use Mailtrap / Gmail app-password / any dev SMTP) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-dev-email@gmail.com
spring.mail.password=your-16-char-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.mail.from=your-dev-email@gmail.com
app.base-url=http://localhost:8080

# ---- Logging ----
logging.level.com.sribalaji.erp=DEBUG
logging.level.org.springframework.security=DEBUG
