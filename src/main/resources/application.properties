spring.application.name=Sri Balaji Kirana and Hardware ERP

# Active profile is chosen at runtime:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   java -jar erp.jar --spring.profiles.active=prod
spring.profiles.active=dev

# ---- Common JPA settings ----
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata

# ---- Common thymeleaf ----
spring.thymeleaf.cache=false

# ---- File upload (product images, if used later) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- App specific ----
app.name=Sri Balaji Kirana and Hardware
app.currency=INR
app.gst.default-slabs=5,12,18,28
app.invoice.starting-number=1
app.low-stock.default-threshold=10
