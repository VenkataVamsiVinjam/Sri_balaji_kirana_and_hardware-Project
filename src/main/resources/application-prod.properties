# ==========================================================
# PROD PROFILE - Linux VPS with domain name
# Run with: java -jar erp.jar --spring.profiles.active=prod
# All secrets are pulled from environment variables - do NOT hardcode
# real passwords in this file when you commit it to git.
#
# Example systemd EnvironmentFile or export before running:
#   export DB_URL=jdbc:mysql://127.0.0.1:3306/erp_prod?useSSL=true&serverTimezone=Asia/Kolkata
#   export DB_USERNAME=erp_user
#   export DB_PASSWORD=strongpassword
#   export MAIL_USERNAME=billing@yourdomain.com
#   export MAIL_PASSWORD=app-password
#   export APP_BASE_URL=https://yourdomain.com
# ==========================================================

server.port=8443
server.address=0.0.0.0

# If you terminate SSL at Nginx/Apache reverse proxy (recommended), keep server.port=8080/8443 internal
# and let Nginx handle the public 443. Uncomment below only if Spring Boot itself serves TLS directly.
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=erp

# ---- MySQL (VPS) ----
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/erp_prod?useSSL=true&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:erp_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5

# ---- JPA / Hibernate ----
# 'validate' is safer once schema is stable in prod. Use 'update' only for the first deploy,
# then switch to 'validate' after confirming the schema is correct.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- Mail ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000

app.mail.from=${MAIL_FROM:billing@yourdomain.com}
app.base-url=${APP_BASE_URL:https://yourdomain.com}

# ---- Logging (write to file on VPS) ----
logging.level.root=WARN
logging.level.com.sribalaji.erp=INFO
logging.file.name=/var/log/erp/erp.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ---- Security hardening ----
server.error.include-stacktrace=never
server.error.include-message=never
