<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Sri Balaji Kirana and Hardware ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; display: flex; align-items: center; }
        .login-card { max-width: 400px; margin: auto; border: none; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
<div class="container">
    <div class="card login-card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-shop fs-1 text-primary"></i>
                <h4 class="mt-2 mb-0">Sri Balaji Kirana and Hardware</h4>
                <small class="text-muted">Inventory &amp; Billing ERP</small>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2">Invalid username or password.</div>
            <div th:if="${param.logout}" class="alert alert-info py-2">You have been logged out.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </button>
            </form>
            <p class="text-muted small text-center mt-3 mb-0">
                Default: admin / Admin@123 (change after first login)
            </p>
        </div>
    </div>
</div>
</body>
</html>
