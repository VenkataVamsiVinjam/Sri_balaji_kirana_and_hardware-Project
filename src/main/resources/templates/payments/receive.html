<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Receive Payment</title></head>
<body>
<div layout:fragment="content">
    <h3 class="mb-3"><i class="bi bi-cash-coin me-2"></i>Receive Payment (Udhaar Collection)</h3>

    <div class="card card-metric p-4 mb-3" style="max-width: 500px;">
        <label class="form-label">Select Customer with Dues</label>
        <select id="customerSelect" class="form-select" onchange="loadInvoices()">
            <option value="">-- Select Customer --</option>
            <option th:each="c : ${customers}" th:value="${c.id}"
                    th:text="${c.name} + ' - Due: ₹' + ${#numbers.formatDecimal(c.outstandingBalance,0,'COMMA',2,'POINT')}"></option>
        </select>
    </div>

    <div class="card card-metric p-3" id="invoicesCard" style="display:none;">
        <h6 class="mb-2">Outstanding Invoices</h6>
        <div class="table-responsive">
            <table class="table">
                <thead class="table-light">
                <tr><th>Invoice</th><th>Date</th><th>Total</th><th>Paid</th><th>Balance Due</th><th>Pay</th></tr>
                </thead>
                <tbody id="invoicesBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Payment modal -->
<div class="modal fade" id="paymentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/payments/save}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Record Payment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="customerId" id="modalCustomerId">
                    <input type="hidden" name="invoiceId" id="modalInvoiceId">

                    <p>Invoice: <strong id="modalInvoiceNumber"></strong></p>
                    <p>Balance Due: <strong id="modalBalanceDue"></strong></p>

                    <div class="mb-3">
                        <label class="form-label">Amount Received *</label>
                        <input type="number" step="0.01" min="0.01" name="amount" id="modalAmount" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Payment Mode</label>
                        <select name="paymentMode" class="form-select">
                            <option value="CASH">Cash</option>
                            <option value="UPI">UPI</option>
                            <option value="CARD">Card</option>
                            <option value="BANK_TRANSFER">Bank Transfer</option>
                            <option value="CHEQUE">Cheque</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Remarks</label>
                        <input type="text" name="remarks" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Payment</button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        function loadInvoices() {
            const customerId = document.getElementById('customerSelect').value;
            const card = document.getElementById('invoicesCard');
            const body = document.getElementById('invoicesBody');

            if (!customerId) {
                card.style.display = 'none';
                return;
            }

            fetch('/api/payments/customer/' + customerId + '/unpaid-invoices')
                .then(r => r.json())
                .then(invoices => {
                    card.style.display = 'block';
                    if (invoices.length === 0) {
                        body.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">No outstanding invoices.</td></tr>';
                        return;
                    }
                    body.innerHTML = invoices.map(inv => `
                        <tr>
                            <td>${inv.invoiceNumber}</td>
                            <td>${inv.invoiceDate}</td>
                            <td>${formatInrWithSymbol(inv.grandTotal)}</td>
                            <td>${formatInrWithSymbol(inv.amountPaid)}</td>
                            <td class="text-danger fw-bold">${formatInrWithSymbol(inv.balanceDue)}</td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick='openPaymentModal(${JSON.stringify(inv)}, ${customerId})'>
                                    Pay
                                </button>
                            </td>
                        </tr>
                    `).join('');
                });
        }

        function openPaymentModal(invoice, customerId) {
            document.getElementById('modalCustomerId').value = customerId;
            document.getElementById('modalInvoiceId').value = invoice.invoiceId;
            document.getElementById('modalInvoiceNumber').textContent = invoice.invoiceNumber;
            document.getElementById('modalBalanceDue').textContent = formatInrWithSymbol(invoice.balanceDue);
            document.getElementById('modalAmount').max = invoice.balanceDue;
            document.getElementById('modalAmount').value = invoice.balanceDue;

            new bootstrap.Modal(document.getElementById('paymentModal')).show();
        }
    </script>
</th:block>
</body>
</html>
