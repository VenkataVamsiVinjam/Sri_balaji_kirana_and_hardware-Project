<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Products</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-box-seam me-2"></i>Products</h3>
        <a href="/products/new" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-plus-lg me-1"></i>Add Product
        </a>
    </div>

    <form method="get" class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search by name or HSN code...">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-outline-primary w-100">Search</button>
        </div>
    </form>

    <div class="card card-metric">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>HSN</th>
                    <th>Category</th>
                    <th>GST%</th>
                    <th>Purchase Unit</th>
                    <th>Sale Unit</th>
                    <th>Conversion</th>
                    <th>Selling Price</th>
                    <th>Stock (Purchase Unit)</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}" th:classappend="${p.lowStock} ? 'table-low-stock' : ''">
                    <td>
                        <a th:href="@{/products/view/{id}(id=${p.id})}" th:text="${p.name}">Product</a>
                        <span th:if="${p.lowStock}" class="badge bg-warning text-dark ms-1">Low Stock</span>
                    </td>
                    <td th:text="${p.hsnCode}">-</td>
                    <td th:text="${p.category}">-</td>
                    <td th:text="${p.gstPercent} + '%'">-</td>
                    <td th:text="${p.purchaseUnit}">-</td>
                    <td th:text="${p.saleUnit}">-</td>
                    <td th:text="'1 ' + ${p.purchaseUnit} + ' = ' + ${#numbers.formatDecimal(p.conversionFactor,1,2)} + ' ' + ${p.saleUnit}">-</td>
                    <td th:text="'₹' + ${#numbers.formatDecimal(p.sellingPrice, 0, 'COMMA', 2, 'POINT')}">-</td>
                    <td th:text="${#numbers.formatDecimal(p.currentStock,1,2)}">-</td>
                    <td>
                        <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-secondary" sec:authorize="hasRole('ADMIN')">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" class="d-inline" sec:authorize="hasRole('ADMIN')"
                              onsubmit="return confirm('Deactivate this product?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="10" class="text-center text-muted py-4">No products found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
