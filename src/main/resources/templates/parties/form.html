<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Party Form</title></head>
<body>
<div layout:fragment="content">
    <h3 class="mb-3">
        <span th:text="${party.id} != null ? 'Edit' : 'Add'"></span>
        <span th:text="${party.partyType != null and party.partyType.name() == 'CUSTOMER'} ? 'Customer' : 'Supplier'"></span>
    </h3>

    <div class="card card-metric p-4" style="max-width: 700px;">
        <form th:action="@{/parties/save}" th:object="${party}" method="post">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{partyType}">

            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Name *</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Phone</label>
                    <input type="text" th:field="*{phone}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">GSTIN <small class="text-muted">(optional)</small></label>
                    <input type="text" th:field="*{gstin}" class="form-control" maxlength="15">
                </div>
                <div class="col-12">
                    <label class="form-label">Address</label>
                    <textarea th:field="*{address}" class="form-control" rows="2"></textarea>
                </div>
                <div class="col-md-6" th:if="${party.id} == null">
                    <label class="form-label">Opening Balance</label>
                    <input type="number" step="0.01" th:field="*{openingBalance}" class="form-control" value="0">
                    <div class="form-text">Amount already due/payable when adding this party. No interest is ever applied.</div>
                </div>
                <div class="col-md-6" th:if="${party.id} != null">
                    <label class="form-label">Current Outstanding Balance</label>
                    <input type="text" th:value="${party.outstandingBalance}" class="form-control" disabled>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
                <a th:href="${party.partyType != null and party.partyType.name() == 'CUSTOMER'} ? '/parties/customers' : '/parties/suppliers'"
                   class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
