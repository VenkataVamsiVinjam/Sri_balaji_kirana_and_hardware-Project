<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Add User</title></head>
<body>
<div layout:fragment="content">
    <h3 class="mb-3"><i class="bi bi-person-plus me-2"></i>Add User</h3>

    <div class="card card-metric p-4" style="max-width: 600px;">
        <form th:action="@{/users/save}" method="post">
            <div class="mb-3">
                <label class="form-label">Username *</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password *</label>
                <input type="password" name="password" class="form-control" required minlength="6">
            </div>
            <div class="mb-3">
                <label class="form-label">Full Name *</label>
                <input type="text" name="fullName" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Role *</label>
                <select name="roleName" class="form-select" required>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Create User</button>
            <a href="/users" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
