<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Users</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-person-gear me-2"></i>Users</h3>
        <a href="/users/new" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add User</a>
    </div>

    <div class="card card-metric">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr><th>Username</th><th>Full Name</th><th>Phone</th><th>Roles</th><th>Status</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.fullName}"></td>
                    <td th:text="${u.phone}">-</td>
                    <td>
                        <span th:each="r : ${u.roles}" class="badge bg-secondary me-1" th:text="${r.name}"></span>
                    </td>
                    <td>
                        <span th:if="${u.enabled}" class="badge bg-success">Active</span>
                        <span th:unless="${u.enabled}" class="badge bg-danger">Disabled</span>
                    </td>
                    <td>
                        <form th:action="@{/users/toggle/{id}(id=${u.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">
                                <span th:if="${u.enabled}">Disable</span>
                                <span th:unless="${u.enabled}">Enable</span>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
