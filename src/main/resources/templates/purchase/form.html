<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>New Purchase Entry</title></head>
<body>
<div layout:fragment="content">
    <h3 class="mb-3"><i class="bi bi-bag-plus me-2"></i>New Purchase Entry</h3>

    <form th:action="@{/purchase/save}" method="post" id="purchaseForm">
        <div class="card card-metric p-3 mb-3">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Supplier *</label>
                    <select name="supplierId" class="form-select" required>
                        <option value="">-- Select Supplier --</option>
                        <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Supplier Invoice Ref <small class="text-muted">(optional)</small></label>
                    <input type="text" name="supplierInvoiceRef" class="form-control">
                </div>
            </div>
        </div>

        <div class="card card-metric p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="mb-0">Items</h6>
                <button type="button" class="btn btn-sm btn-outline-primary" onclick="addRow()">
                    <i class="bi bi-plus-lg"></i> Add Row
                </button>
            </div>
            <div class="table-responsive">
                <table class="table" id="itemsTable">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 30%">Product</th>
                        <th>Purchase Unit</th>
                        <th>Quantity (Purchase Unit)</th>
                        <th>Price / Unit</th>
                        <th>Line Total</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="itemsBody"></tbody>
                </table>
            </div>
            <div class="text-end mt-2">
                <strong>Grand Total (approx, excl. GST breakdown): <span id="grandTotalPreview">₹0.00</span></strong>
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save Purchase</button>
            <a href="/purchase" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        const products = /*[[${products}]]*/ [];
        let rowIndex = 0;

        function addRow() {
            const tbody = document.getElementById('itemsBody');
            const row = document.createElement('tr');
            row.id = 'row-' + rowIndex;

            let options = '<option value="">-- Select Product --</option>';
            products.forEach(p => {
                options += `<option value="${p.id}" data-unit="${p.purchaseUnit}" data-price="${p.purchasePrice}">${p.name}</option>`;
            });

            row.innerHTML = `
                <td>
                    <select name="productId[]" class="form-select form-select-sm" onchange="onProductChange(this, ${rowIndex})" required>
                        ${options}
                    </select>
                </td>
                <td><span id="unit-${rowIndex}" class="text-muted">-</span></td>
                <td><input type="number" step="0.0001" name="quantity[]" class="form-control form-control-sm" oninput="recalcRow(${rowIndex})" required></td>
                <td><input type="number" step="0.01" name="price[]" class="form-control form-control-sm" oninput="recalcRow(${rowIndex})" required></td>
                <td><span id="lineTotal-${rowIndex}">₹0.00</span></td>
                <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(${rowIndex})"><i class="bi bi-x-lg"></i></button></td>
            `;
            tbody.appendChild(row);
            rowIndex++;
        }

        function onProductChange(select, idx) {
            const opt = select.selectedOptions[0];
            document.getElementById('unit-' + idx).textContent = opt.dataset.unit || '-';
            const priceInput = document.querySelector(`tr#row-${idx} input[name="price[]"]`);
            if (opt.dataset.price) priceInput.value = opt.dataset.price;
            recalcRow(idx);
        }

        function recalcRow(idx) {
            const row = document.getElementById('row-' + idx);
            const qty = parseFloat(row.querySelector('input[name="quantity[]"]').value) || 0;
            const price = parseFloat(row.querySelector('input[name="price[]"]').value) || 0;
            const total = qty * price;
            document.getElementById('lineTotal-' + idx).textContent = formatInrWithSymbol(total);
            recalcGrandTotal();
        }

        function recalcGrandTotal() {
            let total = 0;
            document.querySelectorAll('#itemsBody tr').forEach(row => {
                const qty = parseFloat(row.querySelector('input[name="quantity[]"]')?.value) || 0;
                const price = parseFloat(row.querySelector('input[name="price[]"]')?.value) || 0;
                total += qty * price;
            });
            document.getElementById('grandTotalPreview').textContent = formatInrWithSymbol(total);
        }

        function removeRow(idx) {
            document.getElementById('row-' + idx).remove();
            recalcGrandTotal();
        }

        addRow(); // start with one row
    </script>
</th:block>
</body>
</html>
