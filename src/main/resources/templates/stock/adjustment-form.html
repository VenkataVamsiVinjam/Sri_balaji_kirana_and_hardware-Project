<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Stock Adjustment</title></head>
<body>
<div layout:fragment="content">
    <h3 class="mb-3"><i class="bi bi-sliders me-2"></i>Stock Adjustment</h3>
    <p class="text-muted">
        Use this screen to correct stock for damage, expiry, theft/loss, or physical count corrections.
        These adjustments are logged separately and do <strong>not</strong> affect Purchase or Sales reports.
    </p>

    <div class="card card-metric p-4" style="max-width: 700px;">
        <form th:action="@{/stock-adjustment/save}" th:object="${request}" method="post">

            <div class="mb-3">
                <label class="form-label">Product *</label>
                <select th:field="*{productId}" class="form-select" required onchange="onProductChange(this)">
                    <option value="">-- Select Product --</option>
                    <option th:each="p : ${products}" th:value="${p.id}"
                            th:text="${p.name} + ' (Current: ' + ${#numbers.formatDecimal(p.currentStock,1,2)} + ' ' + ${p.purchaseUnit} + ')'"
                            th:attr="data-unit=${p.purchaseUnit},data-stock=${p.currentStock}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Reason *</label>
                <select th:field="*{reason}" class="form-select" required onchange="onReasonChange(this)">
                    <option value="">-- Select Reason --</option>
                    <option th:each="r : ${reasons}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>

            <div class="mb-3" id="directionField" style="display:none;">
                <label class="form-label">Direction</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" th:field="*{increase}" value="false" id="dirDecrease">
                    <label class="form-check-label" for="dirDecrease">Decrease stock (physical count found LESS than system)</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" th:field="*{increase}" value="true" id="dirIncrease">
                    <label class="form-check-label" for="dirIncrease">Increase stock (physical count found MORE than system)</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantity (in Purchase Unit) * <small class="text-muted" id="unitHint"></small></label>
                <input type="number" step="0.0001" min="0.0001" th:field="*{quantity}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Remark <small class="text-muted">(optional)</small></label>
                <textarea th:field="*{remark}" class="form-control" rows="2" placeholder="e.g. Damaged during monsoon leakage"></textarea>
            </div>

            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save Adjustment</button>
            <a href="/reports/stock-adjustment-history" class="btn btn-outline-secondary">View History</a>
        </form>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        function onProductChange(select) {
            const opt = select.selectedOptions[0];
            const unit = opt.dataset.unit || '';
            document.getElementById('unitHint').textContent = unit ? `(in ${unit})` : '';
        }

        function onReasonChange(select) {
            const directionField = document.getElementById('directionField');
            directionField.style.display = select.value === 'PHYSICAL_COUNT_CORRECTION' ? 'block' : 'none';
        }
    </script>
</th:block>
</body>
</html>
