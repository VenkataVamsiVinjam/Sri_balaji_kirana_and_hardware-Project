<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>GST Summary Report</title></head>
<body>
<div layout:fragment="content">
    <h3 class="mb-3"><i class="bi bi-receipt me-2"></i>GST Summary Report</h3>

    <form method="get" class="row g-2 mb-3">
        <div class="col-md-3">
            <label class="form-label">From</label>
            <input type="date" name="fromDate" th:value="${fromDate}" class="form-control">
        </div>
        <div class="col-md-3">
            <label class="form-label">To</label>
            <input type="date" name="toDate" th:value="${toDate}" class="form-control">
        </div>
        <div class="col-md-2 align-self-end">
            <button type="submit" class="btn btn-primary w-100">Generate</button>
        </div>
    </form>

    <div class="card card-metric">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>GST %</th>
                    <th>Taxable Value</th>
                    <th>CGST</th>
                    <th>SGST</th>
                    <th>Total Tax</th>
                    <th>Total Invoice Value</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows}">
                    <td th:text="${row.gstPercent} + '%'"></td>
                    <td th:text="'₹' + ${#numbers.formatDecimal(row.totalTaxableValue, 0, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="'₹' + ${#numbers.formatDecimal(row.totalCgst, 0, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="'₹' + ${#numbers.formatDecimal(row.totalSgst, 0, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="'₹' + ${#numbers.formatDecimal(row.totalTax, 0, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="'₹' + ${#numbers.formatDecimal(row.totalInvoiceValue, 0, 'COMMA', 2, 'POINT')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(rows)}">
                    <td colspan="6" class="text-center text-muted py-4">No sales in this date range.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
