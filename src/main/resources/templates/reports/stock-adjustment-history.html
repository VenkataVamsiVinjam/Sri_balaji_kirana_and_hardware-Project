<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Stock Adjustment History</title></head>
<body>
<div layout:fragment="content">
    <h3 class="mb-3"><i class="bi bi-clock-history me-2"></i>Stock Adjustment History</h3>
    <p class="text-muted">This audit log is separate from Purchase and Sales reports.</p>

    <div class="card card-metric">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Product</th>
                    <th>Reason</th>
                    <th>Quantity Adjusted</th>
                    <th>Direction</th>
                    <th>Stock After</th>
                    <th>Remark</th>
                    <th>Adjusted By</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${adjustments}">
                    <td th:text="${#temporals.format(a.adjustmentDate, 'dd-MM-yyyy HH:mm')}"></td>
                    <td th:text="${a.product.name}"></td>
                    <td>
                        <span class="badge bg-secondary" th:text="${a.reason}"></span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(a.quantity,1,2)} + ' ' + ${a.product.purchaseUnit}"></td>
                    <td>
                        <span th:if="${a.signedQuantityApplied.signum() < 0}" class="text-danger"><i class="bi bi-arrow-down"></i> Decrease</span>
                        <span th:if="${a.signedQuantityApplied.signum() > 0}" class="text-success"><i class="bi bi-arrow-up"></i> Increase</span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(a.stockAfterAdjustment,1,2)}"></td>
                    <td th:text="${a.remark}">-</td>
                    <td th:text="${a.adjustedBy.fullName}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(adjustments)}">
                    <td colspan="8" class="text-center text-muted py-4">No stock adjustments recorded yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
