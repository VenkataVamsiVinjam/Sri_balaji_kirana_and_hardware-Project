# /etc/nginx/sites-available/erp
# Reverse proxy: public 80/443 -> Spring Boot app on 127.0.0.1:8443 (internal only)
#
# Setup:
#   1. sudo cp erp.nginx.conf /etc/nginx/sites-available/erp
#   2. sudo ln -s /etc/nginx/sites-available/erp /etc/nginx/sites-enabled/erp
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d yourdomain.com   (auto-adds the SSL block below)

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # certbot will add a redirect to https here automatically after step 4 above.

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow larger requests for PDF/file handling
        client_max_body_size 10M;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
